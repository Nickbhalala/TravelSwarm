x-app: &app
  build:
    context: .
    args:
      INSTALL_CREW: ${INSTALL_CREW:-false}
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://travelswarm:travelswarm@postgres:5432/travelswarm
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: travelswarm
      POSTGRES_PASSWORD: travelswarm
      POSTGRES_DB: travelswarm
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelswarm"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["15672:15672"]   # management UI (guest/guest, local only)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  gateway:
    <<: *app
    ports: ["8000:8000"]

  worker:
    <<: *app
    command: ["travelswarm-worker"]
    deploy:
      replicas: 2
    # For PLANNER=crewai, mount Google application-default credentials read-only:
    # volumes:
    #   - ~/.config/gcloud:/home/app/.config/gcloud:ro

volumes:
  pg-data:
