name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: travelswarm
          POSTGRES_PASSWORD: travelswarm
          POSTGRES_DB: travelswarm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travelswarm" --health-interval 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,crew]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Integration tests (PostgreSQL + RabbitMQ)
        run: pytest -q -m integration
        env:
          DATABASE_URL: postgresql+psycopg://travelswarm:travelswarm@localhost:5432/travelswarm
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/%2F

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t travelswarm .
